# Doodle Patch (Kids Coloring Book) - nginx site config
# Backend: Node/Express on 127.0.0.1:5050  (/api/*, /images/*)
# Frontend: Vite build in /home/dejassha/Projects/self/coloring-book-website/coloring-book-frontend/dist
#
# Install for coloring-book.conf:
#   sudo cp nginx.conf /etc/nginx/sites-available/coloring-book.conf
#   sudo ln -sf /etc/nginx/sites-available/coloring-book.conf /etc/nginx/sites-enabled/coloring-book.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Local domain as localhost:
#   echo "127.0.0.1 coloringbook.example.com coloring-book.example.com" | sudo tee -a /etc/hosts
#   Then open: http://coloringbook.example.com (not https, no SSL here)
#
# Why images were broken:
# 1. proxy_pass http://127.0.0.1:5050/  (with trailing slash) strips the
#    location prefix, so /api/pictures -> /pictures (404) and
#    /images/star.svg never reached Express. Must be without trailing slash.
# 2. config proxied /media/ or /uploads/ but backend now serves only /images/
#    (backend/server.js -> app.use("/images", ...)), so /images/* fell
#    through to index.html (200 text/html instead of image).

server {
    listen 80;
    server_name coloringbook.example.com;

    root /home/dejassha/Projects/self/coloring-book-website/coloring-book-frontend/dist;
    index index.html;

    # Frontend (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - preserve /api/ prefix (NO trailing slash here)
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend images - single images folder
    location /images/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        access_log off;
    }
}
